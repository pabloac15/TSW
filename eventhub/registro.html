<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-wrapper">
        <div class="login-container card">
            <h1 class="logo-title">EventHub</h1>
            <p class="subtitle">Crea tu cuenta para organizar y unirte a eventos</p>
            
            <!-- El formulario simula el registro y te lleva de vuelta al login -->
            <form action="index.html" method="GET">
                <div class="form-group">
                    <label for="alias">Alias de usuario</label>
                    <input type="text" id="alias" name="alias" required placeholder="Ej. jperez">
                </div>
                
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn">Registrarse</button>
            </form>
            
            <a href="index.html" class="text-link">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </main>
</body>
</html>
