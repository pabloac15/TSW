<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Iniciar Sesión</title>
    <!-- Enlace a nuestra hoja de estilos moderna -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-wrapper">
        <div class="login-container card">
            <!-- Título con gradiente -->
            <h1 class="logo-title">EventHub</h1>
            <p class="subtitle">Gestiona y participa en eventos fácilmente</p>
            
            <form action="eventos.html" method="GET">
                <div class="form-group">
                    <label for="alias">Alias de usuario</label>
                    <input type="text" id="alias" name="alias" required placeholder="Ej. jperez">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <!-- Botón con animaciones hover -->
                <button type="submit" class="btn">Iniciar Sesión</button>
            </form>
            
            <a href="registro.html" class="text-link">¿No tienes cuenta? Regístrate aquí</a>
        </div>
    </main>
</body>
</html>
